<header class="main-header">
    <!--Logo de la plataforma-->
    <div class="logo">
        <a routerLink="/home">
            <img src="assets/images/news.jpg" alt="Logo de Flash News" /><!--Imagen del logo de la plataforma-->
        </a>
    </div>
    <h1 id="title-1">Flash News</h1><!--Título de la plataforma-->

    <!--Lista de menús de navegación en todo la plataforma-->
    <nav class="nav-menu">
        <ul>
            <li><a routerLink="/home">Home</a></li>
            <li><a routerLink="/noticias">Noticias</a></li>
            <li><a routerLink="/favoritos">Mis Favoritos</a></li>
            <li><a routerLink="/contacto">Contacto</a></li>
            <li><a routerLink="/admin">Administración</a></li>
        </ul>
    </nav>
    
    <!--Botón de búsqueda de noticias-->
    <form class="search-box" (ngSubmit)="buscar()">
        <input name="termino" [(ngModel)]="termino" type="search" placeholder="Buscar noticias..." aria-label="Buscar noticias" />
        <button type="submit" aria-label="Ejecutar busqueda"></button>
    </form>
</header>
